# Project Configuration for LLMOps Course

# Development environment
dev:
  catalog: mlops_dev
  schema: lukaszag
  volume: lukaszag_files
  llm_endpoint: databricks-llama-4-maverick
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 7077f4cb0e616c62
  vector_search_endpoint: llmops_vs_endpoint_dev
  lakebase_project_id: semantic-agent-lakebase-dev
  experiment_name: /Shared/semantic-curator-dev

acc:
  catalog: llmops_acc 
  schema: lukaszag 
  volume: lukaszag_files
  llm_endpoint: databricks-meta-llama-3-1-70b-instruct
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 7077f4cb0e616c62
  vector_search_endpoint: llmops_vs_endpoint_acc 
  lakebase_project_id: semantic-agent-lakebase-acc
  experiment_name: /Shared/semantic-curator-acc

# Production environment
prd:
  catalog: llmops_prd
  schema: lukaszag
  volume: lukaszag_files
  llm_endpoint: databricks-meta-llama-3-1-70b-instruct
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 7077f4cb0e616c62
  vector_search_endpoint: llmops_vs_endpoint_prd
  lakebase_project_id: semantic-agent-lakebase-prd
  experiment_name: /Shared/semantic-curator-prd


  



# Model configuration
model_config:
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.95

# Vector search configuration
vector_search:
  embedding_dimension: 1024
  similarity_metric: cosine
  num_results: 5

# Chunking configuration
chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"
