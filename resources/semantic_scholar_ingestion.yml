resources:
  jobs:
    semantic_scholar_ingestion_job: 
      name: semantic_scholar_ingestion
      tags:
        project_name: "semantic_scholar"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: semantic_scholar_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/semantic_scholar_ingestion.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"